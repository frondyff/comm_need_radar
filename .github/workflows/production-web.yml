name: Production Web

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - integration/production-web

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:api
      - run: npm run test:unit
      - run: npm run validate:boundaries
      - run: npm run validate:dashboard-adapter
      - run: npm run validate:chatbot
      - run: npm run test:flyer
      - run: npm run test:release-state
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/validate_spatial_joins.py
      - run: python scripts/validate_scoring_bias.py
